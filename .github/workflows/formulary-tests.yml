name: Formulary regression tests

on:
  push:
    branches:
      - main
      - improve/formulary-safety-and-validation
  pull_request:
    branches:
      - main

jobs:
  dose-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run dose display and CSV regression tests
        run: node --test tests/dose-validation.test.js
